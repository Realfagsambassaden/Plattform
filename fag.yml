# Fagene som hentes inn på nettstedene. Ett fag = ett repo laget fra malen Realfagsambassaden/fag-mal.
# Faget bestemmer selv nettsted, navn og status i sin egen fag.yml.
# Hvert publisert fag får automatisk et løypekort på forsiden (verktoy/forside.py).
# «niva:» er standardnivået for sidene i faget: forkurs | ingenior | fordypning (en side kan overstyre med «niva:» øverst).
# Valgfritt per fag: «tegning:» (fil i assets/img/tegninger/, uten .webp) og «kort:» (teksten på kortet).
# (Forkurset TRES0312 hentes egen vei, fra LaTeX-kompendiet – se bygg.sh.)
fag:
  - repo: Realfagsambassaden/fysikk-forkurs
    niva: forkurs
    tegning: hallo
    kort: "Fysikk fra grunnen av for deg som skal begynne på ingeniør- eller realfag. Bygger på TRES0312 ved NTNU og dekker hele forkurspensumet, med video, regneeksempler og oppgaver med hint."
  - repo: Realfagsambassaden/ingeniorfysikk
    niva: ingenior
    tegning: skratt-kast
    kort: "Mekanikk for ingeniørstudenter: kinematikk, Newtons lover, energi, bevegelsesmengde og rotasjon."
  # - repo: Realfagsambassaden/fysikk-mekanikk
