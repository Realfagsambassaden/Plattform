# Løype: IFYA1000 Fysikk (NTNU Ålesund). Plukker ut sidene emnet trenger fra faget Ingeniørfysikk (kilde: utvalg, se verktoy/tema.py).
# Temasidene er generelle (AGENTS.md §3). Alt om emnet hører hjemme her. Legg gjerne til «uke:» per kapittel.
id: ifya1000
tittel: IFYA1000 Fysikk
institusjon: NTNU Ålesund
emnekode: IFYA1000
niva: ingenior
kilde: utvalg
beskrivelse: Mekanikk, fluidmekanikk, svingninger og bølger for ingeniørstudenter.
tekst: |
  Emnet har to deler: **grunnleggende mekanikk** og **fluidmekanikk, svingninger og bølger**. Mekanikkdelen er den samme som i IFYA1002.

  Eksamen er skriftlig og digital (4 timer). Ingen trykte eller håndskrevne hjelpemidler, bare en enkel kalkulator. For å gå opp til eksamen må regneøvingene og laboratorierapporten være godkjent.
