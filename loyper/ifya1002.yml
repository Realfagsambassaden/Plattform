# Løype: IFYA1002 Fysikk (NTNU Ålesund). Plukker ut sidene emnet trenger fra læreboka Ingeniørfysikk (kilde: utvalg, se verktoy/tema.py).
# Temasidene er generelle (AGENTS.md §3). Alt om emnet hører hjemme her. Legg gjerne til «uke:» per kapittel.
id: ifya1002
tittel: IFYA1002 Fysikk
institusjon: NTNU Ålesund
emnekode: IFYA1002
niva: ingenior
kilde: utvalg
beskrivelse: Mekanikk, elektrisitet og magnetisme for ingeniørstudenter.
tekst: |
  Emnet har to deler: **grunnleggende mekanikk** og **elektrisitet og magnetisme**. Mekanikkdelen er den samme som i IFYA1000.

  Eksamen er skriftlig og digital (4 timer). Ingen trykte eller håndskrevne hjelpemidler, bare en enkel kalkulator. For å gå opp til eksamen må regneøvingene og laboratorierapporten være godkjent.
