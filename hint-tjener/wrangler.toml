# KI-tjeneren (hint, dekningskart og studieappen). Publiseres av GitHub-automatikken (.github/workflows/bygg.yml,
# jobben «hint-tjener») hver gang noe flettes til main.
# Hemmeligheten ANTHROPIC_API_KEY legges inn som GitHub-hemmelighet i repoet og settes på workeren ved publisering.
name = "fysikkhjelp-hint"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Egen adresse. Cloudflare lager DNS-oppføringen selv, fordi fysikkhjelp.no ligger i samme konto.
routes = [{ pattern = "hint.fysikkhjelp.no", custom_domain = true }]

# Offentlige verdier (de samme som står i _quarto.yml). Brukes for å sjekke at brukeren er logget inn.
[vars]
