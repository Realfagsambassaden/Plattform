# KI-tjeneren (hint, dekningskart og studieappen). Publiseres av GitHub-automatikken (.github/workflows/bygg.yml,
# jobben «hint-tjener») hver gang noe flettes til main.
# Hemmeligheten ANTHROPIC_API_KEY legges inn som GitHub-hemmelighet i repoet og settes på workeren ved publisering.
name = "fysikkhjelp-hint"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Egen adresse. Cloudflare lager DNS-oppføringen selv, fordi fysikkhjelp.no ligger i samme konto.
routes = [{ pattern = "hint.fysikkhjelp.no", custom_domain = true }]

# Offentlige verdier (de samme som står i _quarto.yml). Brukes for å sjekke at brukeren er logget inn.
[vars]
SUPABASE_URL = "https://fwyoldmtjnfxtkdwldzx.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_mapCEnSSxrSSwTbBKao6hw_qMOClLSS"

# Valgfritt: begrens antall forespørsler per bruker. Lag et KV-navnerom i Cloudflare (Storage & databases → KV),
# og lim inn id-en under (fjern #-tegnene).
# [[kv_namespaces]]
# binding = "HINT_KV"
# id = "LIM-INN-ID-HER"

# Figurene til eksamenstreningen (verktoy/eksamener.py legger dem i statisk/eksamen/ ved publisering).
[assets]
directory = "./statisk"

# Instruksen til Dashman (dashman-instruks.md) bygges inn i workeren som tekst.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Valgfritt: egen modell for Dashman (ellers MODELL / standardmodellen), f.eks.
# MODELL_DASHMAN = "claude-sonnet-5-5"   (legg under [vars])

# Push-varsler: oppmøtesjekker hvert minutt, andre varsler hvert kvarter (hint-tjener/push.js, supabase/oppsett.sql: push_jobb).
# Hemmelighetene PUSH_HEMMELIG og VAPID_PRIVATE_KEY settes fra GitHub ved publisering.
[triggers]
crons = ["* * * * *"]   # hvert minutt: oppmøtesjekker; de andre varslene hvert kvarter (push.js)
