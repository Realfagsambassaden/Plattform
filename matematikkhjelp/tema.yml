          - { id: tangenter, tittel: "Tangenter og normaler" }
          - { id: derivasjonsregler, tittel: "Derivasjonsregler" }
          - { id: kjerneregelen, tittel: "Sammensatte funksjoner og kjerneregelen" }
          - { id: produkt-og-kvotient, tittel: "Produkt- og kvotientregelen" }
