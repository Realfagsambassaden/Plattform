# Temakartet for matematikkhjelp.no – grunnmuren for alt stoff.
# Område → temaer → undertemaer. Rekkefølgen her er rekkefølgen på nettsiden.
# Sider kobles til et tema med «tema: <id>» og «undertema: <id>» øverst i en .qmd-fil (og eventuelt «niva:»).
# Temasiden viser en tabell undertema × nivå (forkurs, ingenior, fordypning). Undertemaet «oppgaver»
# (blandede oppgaver) finnes automatisk i alle temaer.
# «bilde» er en tegning i assets/img/tegninger/ (valgfritt).
# Vi sier «tema», ikke «emne», fordi «emne» også betyr et kurs (emnekode, emnebeskrivelse).

omrader:
  - id: grunnlag
    tittel: "Grunnlag"
    beskrivelse: "Tall, algebra og funksjoner: verktøyene resten av matematikken bygger på."
    temaer:
      - id: tall-og-regneregler
        tittel: "Tall og regneregler"
        undertemaer:
          - { id: tallregning, tittel: "Tall og regnerekkefølge" }
          - { id: brokregning, tittel: "Brøkregning" }
          - { id: bokstavregning, tittel: "Bokstavregning og parenteser" }
          - { id: potenser, tittel: "Potenser og potensregler" }
          - { id: standardform, tittel: "Tall på standardform" }
          - { id: rotter, tittel: "Røtter og brøkeksponenter" }
      - id: algebra-og-likninger
        tittel: "Algebra og likninger"
        undertemaer:
          - { id: likninger, tittel: "Likninger" }
          - { id: formler, tittel: "Formler" }
          - { id: likningssett, tittel: "Likningssett" }
          - { id: faktorisering, tittel: "Kvadratsetningene og faktorisering" }
          - { id: rasjonale-uttrykk, tittel: "Rasjonale uttrykk og likninger" }
          - { id: andregradslikninger, tittel: "Andregradslikninger" }
          - { id: polynomer, tittel: "Polynomer og polynomdivisjon" }
          - { id: ulikheter, tittel: "Ulikheter" }
          - { id: intervall-og-mengder, tittel: "Intervaller og mengder" }
      - id: funksjoner
        tittel: "Funksjoner og grafer"
        undertemaer:
          - { id: rette-linjer, tittel: "Rette linjer" }
          - { id: grafisk-losning, tittel: "Graftegning og grafisk løsning" }
          - { id: funksjonsbegrepet, tittel: "Funksjonsbegrepet" }
          - { id: andregradsfunksjoner, tittel: "Andregradsfunksjoner" }
          - { id: potens-og-rotfunksjoner, tittel: "Potens- og rotfunksjoner" }
      - id: eksponential-og-logaritme
        tittel: "Eksponential- og logaritmefunksjoner"
        undertemaer:
          - { id: logaritmer, tittel: "Logaritmer" }
          - { id: eksponentiallikninger, tittel: "Eksponential- og logaritmelikninger" }
          - { id: ln-og-e, tittel: "Den naturlige logaritmen og e" }
          - { id: drofting, tittel: "Drøfting av eksponential- og logaritmefunksjoner" }
      - id: geometri
        tittel: "Geometri"
        undertemaer:
          - { id: pytagoras, tittel: "Pytagorassetningen" }
          - { id: romfigurer, tittel: "Areal og volum" }
      - id: trigonometri
        tittel: "Trigonometri"
        undertemaer:
          - { id: rettvinklet, tittel: "Sinus, cosinus og tangens i rettvinklede trekanter" }
          - { id: trekantsetninger, tittel: "Arealsetningen, sinussetningen og cosinussetningen" }
          - { id: radianer-og-enhetssirkelen, tittel: "Radianer og enhetssirkelen" }
          - { id: trigonometriske-likninger, tittel: "Trigonometriske likninger og ulikheter" }
          - { id: trigonometriske-formler, tittel: "Trigonometriske formler" }
          - { id: trigonometriske-funksjoner, tittel: "Trigonometriske funksjoner" }
      - { id: komplekse-tall, tittel: "Komplekse tall" }

  - id: kalkulus
    tittel: "Kalkulus"
    beskrivelse: "Grenseverdier, derivasjon og integrasjon: matematikken for endring."
    bilde: flate-normal
    temaer:
      - id: grenseverdier
        tittel: "Grenseverdier og kontinuitet"
        undertemaer:
          - { id: grenseverdier, tittel: "Grenseverdier" }
          - { id: kontinuitet, tittel: "Kontinuitet" }
          - { id: asymptoter, tittel: "Asymptoter" }
      - id: derivasjon
        tittel: "Derivasjon"
        undertemaer:
