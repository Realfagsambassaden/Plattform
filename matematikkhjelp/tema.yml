      - id: integrasjonsteknikker
        tittel: "Integrasjonsteknikker"
        undertemaer:
          - { id: numerisk, tittel: "Numerisk integrasjon" }
          - { id: variabelskifte, tittel: "Variabelskifte" }
          - { id: delvis, tittel: "Delvis integrasjon" }
          - { id: delbrok, tittel: "Delbrøkoppspalting" }
      - id: anvendelser-integrasjon
        tittel: "Anvendelser av integrasjon"
        undertemaer:
          - { id: volum, tittel: "Integrasjon og volum" }
      - id: folger-og-rekker
        tittel: "Følger og rekker"
        undertemaer:
          - { id: tallfolger, tittel: "Tallfølger og rekker" }
          - { id: aritmetiske, tittel: "Aritmetiske følger og rekker" }
          - { id: geometriske, tittel: "Geometriske følger og rekker" }
          - { id: uendelige, tittel: "Uendelige rekker" }
      - { id: taylor, tittel: "Taylorpolynomer og -rekker" }
      - { id: differensiallikninger, tittel: "Differensiallikninger" }

  - id: linalg
    tittel: "Lineær algebra"
