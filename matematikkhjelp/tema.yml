          - { id: variabelskifte, tittel: "Variabelskifte" }
          - { id: delvis, tittel: "Delvis integrasjon" }
          - { id: delbrok, tittel: "Delbrøkoppspalting" }
      - id: anvendelser-integrasjon
        tittel: "Anvendelser av integrasjon"
        undertemaer:
          - { id: volum, tittel: "Integrasjon og volum" }
      - id: flervariable-funksjoner
        tittel: "Funksjoner av flere variabler"
        undertemaer:
          - { id: kontinuitet, tittel: "Grenseverdier og kontinuitet i flere variabler" }
          - { id: partiellderiverte, tittel: "Partiellderiverte" }
          - { id: nivakurver, tittel: "Nivåkurver og gradient" }
      - id: folger-og-rekker
        tittel: "Følger og rekker"
        undertemaer:
