          - { id: bestemt-integral, tittel: "Bestemt integral og fundamentalsetningen" }
          - { id: areal, tittel: "Areal ved integrasjon" }
      - id: integrasjonsteknikker
        tittel: "Integrasjonsteknikker"
        undertemaer:
