# Fagene som hentes inn på matematikkhjelp.no. Ett fag = ett repo laget fra malen Realfagsambassaden/fag-mal,
# med «nettsted: matematikkhjelp» i fagets egen fag.yml.
# Hvert publisert fag får automatisk et løypekort på forsiden (se ../fag.yml for «tegning:» og «kort:»).
fag:
  - repo: Realfagsambassaden/matte-forkurs
    niva: forkurs
    tegning: matte-scene
    kort: "Matematikk fra grunnen av for deg som skal begynne på ingeniør- eller realfag: algebra, funksjoner, derivasjon, trigonometri, vektorer og integrasjon, med eksempler og oppgaver med hint."
  - repo: Realfagsambassaden/flervariabel-kalkulus
    niva: ingenior
    tegning: flate-normal
    kort: "Dobbelt- og trippelintegraler, vektorfelt og integralsetningene, partielle differensiallikninger og numeriske metoder: endelige differanser og endelig volum, med kjørbar Python."
