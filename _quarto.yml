              var s = document.querySelector('script[src*="site_libs/"]');
              var root = s ? s.getAttribute('src').split('site_libs/')[0] : '';
              ['assets/js/konto.js', 'assets/js/loype.js', 'assets/js/kode.js', 'assets/js/oppgaver.js', 'assets/js/forelesning-knapp.js', 'assets/js/bakgrunn.js'].forEach(function (p) {
