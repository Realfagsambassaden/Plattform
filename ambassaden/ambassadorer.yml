# Ambassadørene. Alt om samlekortene og profilsidene står her, og verktoy/samlekort.py lager HTML-en ut fra fila
# (Realfagsambassaden: forsiden og profil/<id>.html; fysikkhjelp.no: forsiden og «Om oss» for dem med fysikkhjelp under nettsteder).
# Rediger gjerne rett i GitHub. Felt som står tomme, vises som «???» på kortet eller som «Kommer snart» på profilen.
#
#   utdanning: skår 0–100 (søyle på kortet), utdanning_tekst: hva den står for
#   erfaring_ar: år med undervisning og formidling (søyle på kortet; full søyle = 20 år)
#   kvalitet:  ett eller to ord («Engasjert», «Kul», «Koselig» …)
#   funfact:   noe artig (kort, helst under 60 tegn)
#   koffein:   antall kaffekopper om dagen; energidrikk: antall energidrikker; koffeinpiller: antall koffeinpiller; ekstra_koffein: [[kaffe, 20], …] legges til etter i rekka; koffein_tittel: egen tekst når man holder musa over; te: true hvis det også går mye te
#              (mer enn 10 til sammen «sprenger skalaen»: rekka går ut av kortet)
#   booking:   e-post for å booke personen (foredrag, show, skolebesøk, privatundervisning); booking_tekst: egen tekst foran
#   farge:     gronn, oransje, bla, rosa, turkis, gul
