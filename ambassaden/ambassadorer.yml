# Ambassadørene. Alt om samlekortene og profilsidene står her, og verktoy/samlekort.py lager HTML-en ut fra fila
# (Realfagsambassaden: forsiden og profil/<id>.html; fysikkhjelp.no: forsiden og «Om oss» for dem med fysikkhjelp under nettsteder).
# Rediger gjerne rett i GitHub. Felt som står tomme, vises som «???» på kortet eller som «Kommer snart» på profilen.
#
#   utdanning: skår 0–100 (søyle på kortet), utdanning_tekst: hva den står for
#   erfaring_ar: år med undervisning og formidling (søyle på kortet; full søyle = 20 år)
#   kvalitet:  ett eller to ord («Engasjert», «Kul», «Koselig» …)
#   funfact:   noe artig (kort, helst under 60 tegn)
#   koffein:   antall kaffekopper om dagen (10 eller mer «sprenger skalaen»: koppene går ut av kortet)
#   te:        true hvis det også går mye te (vises som tekopper)
#   farge:     gronn, oransje, bla, rosa, turkis, gul
ambassadorer:
  - id: ben
    navn: Dr. Normann
    fullt_navn: Ben David Normann
    foto: ben-portrett.webp
    ikon: drnormann-ikon.png
    rolle: Ph.d. i matematisk kosmologi
    farge: gronn
    nettsteder: [fysikkhjelp]
    utdanning: 95
    utdanning_tekst: Ph.d.
    erfaring_ar: 10
    kvalitet:
    funfact:
    koffein: 3
    om: >-
      Jeg heter Ben, har doktorgrad i matematisk kosmologi og har formidlet og undervist realfag i ti år. Forklaringene jeg legger ut,
      er de jeg selv skulle ønske jeg hadde som student: én idé om gangen, tegnet ut på tavla, med regning du kan følge linje for linje.
      Jeg vil at du skal skjønne <em>hvorfor</em> fysikken er som den er, ikke bare hvilken formel du skal bruke.
    utdanning_og_bakgrunn:
    erfaring:
      - Doktorgrad i matematisk kosmologi
      - Forsker og underviser i fysikk og matematikk ved NTNU
      - Lager undervisningsvideoer som Dr. Normann
    meritter:
      - Har holdt TEDx-foredrag
      - Vant den nasjonale finalen i Forsker Grand Prix 2018
      - Vant to priser for filmserien «Kosmologi med Ben», som snart kommer på NRK
    tilbud:
      - [Forkurs i fysikk, https://fysikkhjelp.no/fysikk-forkurs/index.html]
      - [Ingeniørfysikk, https://fysikkhjelp.no/ingeniorfysikk/index.html]
      - [Forkurs i matematikk, https://matematikkhjelp.no/matte-forkurs/index.html]
      - [Flervariabel kalkulus, https://matematikkhjelp.no/flervariabel-kalkulus/index.html]
    sosiale: {youtube: , instagram: , tiktok: , facebook: , linkedin: , nettside: }

