# Fletter pull requests fra nattjobben automatisk (grener som heter natt/…), og starter byggingen av nettstedet.
# (En fletting gjort av GitHub Actions starter ikke «Bygg fysikkhjelp.no» av seg selv, derfor startes den her.)
# Andre grener blir stående til et menneske fletter dem.
name: Flett nattjobben
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  flett:
    if: >-
      startsWith(github.head_ref, 'natt/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Flett PR-en (squash)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --repo ${{ github.repository }}
      - name: Start byggingen av nettstedet
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bygg.yml --repo ${{ github.repository }} --ref main
