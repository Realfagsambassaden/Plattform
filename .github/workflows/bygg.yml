# Bygger fysikkhjelp.no fra fagrepoene og legger den ut.
# Kjører når noe endres i dette repoet, når et fagrepo «ringer på» (repository_dispatch),
# eller når du starter den manuelt fra Actions-fanen.
name: Bygg fysikkhjelp.no

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [kilde-oppdatert]
  workflow_dispatch:

concurrency:
  group: bygg
  cancel-in-progress: true

jobs:
  bygg-og-publiser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Installer LaTeX (TikZ-figurene og PDF-kompendiene) og pdftocairo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-science texlive-fonts-recommended \
            texlive-lang-european texlive-xetex lmodern poppler-utils librsvg2-bin

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-pakker
        run: pip install pyyaml

      - name: Husk ferdige figurer mellom kjøringer
        uses: actions/cache@v4
        with:
          path: .figur-cache
          key: figurer-${{ github.run_id }}
          restore-keys: figurer-

      - name: Bygg nettsiden
        run: bash bygg.sh

      - name: Publiser til Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # matematikkhjelp.no – samme verktøy og utseende som fysikkhjelp.no, egen mappe (matematikkhjelp/).
  matematikkhjelp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Installer LaTeX (figurer og PDF-kompendier) og pdftocairo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-science texlive-fonts-recommended \
            texlive-lang-european texlive-xetex lmodern poppler-utils librsvg2-bin

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-pakker
        run: pip install pyyaml

      - name: Bygg nettsiden
        run: bash matematikkhjelp/bygg.sh

      - name: Publiser til Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: matematikkhjelp
          command: deploy

  # Realfagsambassaden (paraplysiden) – ren HTML, publiseres direkte uten bygging.
  realfagsambassaden:
    runs-on: ubuntu-latest
    env:
      DONASJON_TOKEN: ${{ secrets.DONASJON_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publiser til Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ambassaden
          command: deploy
      - name: Nøkkel for donasjoner (hvis den finnes)
        if: env.DONASJON_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ambassaden
          command: deploy
          secrets: |
            GH_DONASJON
        env:
          GH_DONASJON: ${{ secrets.DONASJON_TOKEN }}
