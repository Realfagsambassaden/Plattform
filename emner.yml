# Emnekartet for fysikkhjelp.no – grunnmuren for alt stoff.
# Område → emner. Rekkefølgen her er rekkefølgen på nettsiden.
# Sider kobles til emner i loyper/*.yml (forkurset) eller med «emne:» øverst i en .qmd-fil (fag fra malen).
# «bilde» er en tegning i assets/img/tegninger/ (valgfritt).
# «delemner» deler et emne i mindre biter. Hver side merkes med «delemne: <id>» (og eventuelt «niva:»),
# og emnesiden viser en tabell delemne × nivå (forkurs, ingenior, fordypning). Delemnet «oppgaver»
# (blandede oppgaver) finnes automatisk i alle emner.

omrader:
  - id: grunnlag
    tittel: "Grunnlag og verktøy"
    beskrivelse: "Hva fysikk er, størrelser og enheter, og matematikken vi trenger."
    bilde: sau-maling
    emner:
      - id: hva-er-fysikk
        tittel: "Hva er fysikk?"
        delemner:
          - { id: hva-er-fysikk, tittel: "Hva er fysikk" }
          - { id: overslag, tittel: "Overslag og størrelsesordener" }
      - id: storrelser-og-enheter
        tittel: "Størrelser og enheter"
        delemner:
          - { id: si, tittel: "Fysiske størrelser og SI" }
          - { id: enhetsregning, tittel: "Å regne med enheter" }
      - id: maling-og-usikkerhet
        tittel: "Tall, måling og usikkerhet"
        delemner:
          - { id: gjeldende-siffer, tittel: "Gjeldende siffer" }
          - { id: standardform, tittel: "Standardform" }
          - { id: usikkerhet, tittel: "Måleusikkerhet og beregning" }
      - id: matematiske-verktoy
        tittel: "Matematiske verktøy"
        delemner:
          - { id: algebra, tittel: "Likninger og algebra" }
          - { id: funksjoner, tittel: "Funksjoner og grafer" }
          - { id: trigonometri, tittel: "Trigonometri" }
      - id: vektorer
        tittel: "Vektorer"
        delemner:
          - { id: dekomponering, tittel: "Vektorer og dekomponering" }
          - { id: vektorregning, tittel: "Regning med vektorer" }
      - id: modellering
        tittel: "Modellering og problemløsning"
        delemner:
          - { id: modellering, tittel: "Matematisk modellering" }

  - id: mekanikk
    tittel: "Mekanikk"
    beskrivelse: "Bevegelse, krefter, energi og likevekt."
    bilde: kjelke
    emner:
      - id: kinematikk
        tittel: "Kinematikk"
        delemner:
          - { id: posisjon-fart-akselerasjon, tittel: "Posisjon, fart og akselerasjon" }
          - { id: konstant-akselerasjon, tittel: "Konstant akselerasjon" }
          - { id: to-dimensjoner, tittel: "Bevegelse i to dimensjoner" }
      - id: sirkelbevegelse
        tittel: "Sirkelbevegelse"
        delemner:
          - { id: sentripetal, tittel: "Sentripetalakselerasjon" }
          - { id: sirkel-krefter, tittel: "Krefter i sirkelbevegelse" }
      - id: newtons-lover
        tittel: "Newtons lover og krefter"
        delemner:
          - { id: newtons-lover, tittel: "Newtons lover" }
          - { id: krefter-i-planet, tittel: "Krefter i planet" }
          - { id: friksjon-fjaer-snorer, tittel: "Friksjon, fjær og snorer" }
          - { id: luftmotstand, tittel: "Luftmotstand" }
      - id: bevegelsesmengde
        tittel: "Bevegelsesmengde og støt"
        delemner:
          - { id: kraftstot, tittel: "Bevegelsesmengde og kraftstøt" }
          - { id: kollisjoner, tittel: "Bevaring og kollisjoner" }
      - id: arbeid-og-energi
        tittel: "Arbeid og energi"
        delemner:
          - { id: arbeid, tittel: "Arbeid" }
          - { id: energiformer, tittel: "Kinetisk og potensiell energi" }
          - { id: energibevaring, tittel: "Energibevaring og energitap" }
          - { id: effekt, tittel: "Effekt" }
      - id: statikk
        tittel: "Likevekt og kraftmoment"
        delemner:
          - { id: kraftlikevekt, tittel: "Kraftlikevekt" }
          - { id: kraftmoment, tittel: "Kraftmoment og rotasjonslikevekt" }
          - { id: massesenter, tittel: "Massesenter" }
      - id: rotasjon
        tittel: "Rotasjon og spinn"
        delemner:
          - { id: rotasjonskinematikk, tittel: "Rotasjonskinematikk" }
          - { id: treghetsmoment, tittel: "Treghetsmoment og rotasjonsenergi" }
          - { id: rulling, tittel: "Kraftmoment og rulling" }
          - { id: dreieimpuls, tittel: "Dreieimpuls" }
      - { id: gravitasjon, tittel: "Gravitasjon" }
      - id: svingninger
        tittel: "Svingninger"
        delemner:
          - { id: harmoniske, tittel: "Harmoniske svingninger" }
          - { id: pendel, tittel: "Fjær og pendel" }

  - id: fluider
    tittel: "Fluidmekanikk"
    beskrivelse: "Trykk, oppdrift og strømning i væsker og gasser."
    bilde: hydraulikk
    emner:
      - id: hydrostatikk
        tittel: "Trykk og oppdrift"
        delemner:
          - { id: trykk, tittel: "Trykk og Pascals lov" }
          - { id: oppdrift, tittel: "Oppdrift og Arkimedes' lov" }
      - { id: stromning, tittel: "Strømning og Bernoulli" }

  - id: termofysikk
    tittel: "Termofysikk"
    beskrivelse: "Temperatur, varme, gasser og termodynamikkens lover."
    bilde: rakett
    emner:
      - id: temperatur-og-varme
        tittel: "Temperatur og varme"
        delemner:
          - { id: indre-energi, tittel: "Indre energi, varme og temperatur" }
          - { id: kalorimetri, tittel: "Faseoverganger og kalorimetri" }
          - { id: varmetransport, tittel: "Varmetransport" }
      - id: termodynamikk
        tittel: "Termodynamikkens lover"
        delemner:
          - { id: forste-lov, tittel: "Termodynamikkens 1. lov" }
          - { id: prosesser, tittel: "Prosesser og pV-diagram" }
          - { id: andre-lov, tittel: "Termodynamikkens 2. lov" }
      - id: gasser
        tittel: "Gasser og kinetisk teori"
        delemner:
          - { id: idealgass, tittel: "Idealgass" }

  - id: elektromagnetisme
    tittel: "Elektromagnetisme"
    beskrivelse: "Ladning, felt, strøm, kretser og magnetisme."
    bilde: e-felt
    emner:
      - id: elektrisk-felt
        tittel: "Ladning og elektrisk felt"
        delemner:
          - { id: ladning, tittel: "Elektrisk ladning" }
          - { id: coulomb, tittel: "Coulombs lov" }
          - { id: felt, tittel: "Elektrisk felt" }
          - { id: homogent-felt, tittel: "Ladning i homogent felt" }
      - id: elektrisk-potensial
        tittel: "Elektrisk potensial"
        delemner:
          - { id: potensiell-energi, tittel: "Elektrisk potensiell energi" }
          - { id: potensial, tittel: "Potensial og spenning" }
      - id: kretser
        tittel: "Strøm og kretser"
        delemner:
          - { id: strom-spenning, tittel: "Strøm og spenning" }
          - { id: motstand, tittel: "Motstand og Ohms lov" }
          - { id: kirchhoff, tittel: "Kirchhoffs lover" }
          - { id: emf, tittel: "Elektromotorisk spenning og indre resistans" }
          - { id: effekt, tittel: "Elektrisk effekt" }
      - { id: magnetisme, tittel: "Magnetisme og induksjon" }

  - id: bolger
    tittel: "Bølger og optikk"
    beskrivelse: "Bølger, lyd og lys."
    emner:
      - id: bolger-og-lyd
        tittel: "Bølger og lyd"
        delemner:
          - { id: bolger, tittel: "Bølger og bølgeegenskaper" }
          - { id: straling, tittel: "Stråling og drivhuseffekten" }
      - { id: optikk, tittel: "Optikk" }

  - id: moderne
    tittel: "Moderne fysikk"
    beskrivelse: "Relativitet, kvantefysikk og universet."
    bilde: euler-lagrange
    emner:
      - { id: relativitet, tittel: "Relativitetsteori" }
      - { id: kvantefysikk, tittel: "Kvantefysikk" }
      - id: atom-og-kjerne
        tittel: "Atom- og kjernefysikk"
        delemner:
          - { id: atomet, tittel: "Atomets oppbygning" }
          - { id: radioaktivitet, tittel: "Radioaktivitet og stråling" }
          - { id: kjerneenergi, tittel: "Kjernereaksjoner og kjerneenergi" }
      - { id: kosmologi, tittel: "Kosmologi" }
